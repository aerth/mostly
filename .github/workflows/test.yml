name: go-test
on:
  push:
    branches:
      - master
      - dev
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  golangci:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: run tests
        run: go test -v ./...
